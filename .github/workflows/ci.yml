name: ci

on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: check / clippy / test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gnu
      - name: cargo check --tests
        run: cargo check --tests --locked
      - name: cargo clippy (advisory)
        run: cargo clippy --all-targets --locked -- -W clippy::all 2>&1 | tee clippy.txt
        continue-on-error: true
      - name: cargo test
        run: cargo test --locked -- --test-threads=4
      - name: rustfmt (advisory)
        run: cargo fmt --all -- --check
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clippy-report
          path: clippy.txt
          if-no-files-found: ignore

  worker-auth:
    name: workers/auth tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test workers/auth/worker.test.mjs

  build-musl:
    name: build x86_64-unknown-linux-musl
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install musl-tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: musl
      - name: cargo build --release (musl)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: package
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/fucf dist/fucf-linux-x86_64
          file dist/fucf-linux-x86_64
          ./dist/fucf-linux-x86_64 --version || ./dist/fucf-linux-x86_64 --help | head -5 || true
          (cd dist && sha256sum fucf-linux-x86_64 > fucf-linux-x86_64.sha256)
          echo "${GITHUB_SHA}" > dist/COMMIT
          cat dist/fucf-linux-x86_64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: fucf-linux-x86_64
          path: dist/
          retention-days: 30

  ui-screenshots:
    name: UI screenshots
    needs: build-musl
    runs-on: ubuntu-24.04
    env:
      # a throwaway token for the throwaway instance below
      UI_TOKEN: ui-check-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fucf-linux-x86_64
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: start fucf
        run: |
          chmod +x dist/fucf-linux-x86_64
          mkdir -p /tmp/fucf-ui
          FUCF_DATA_DIR=/tmp/fucf-ui FUCF_API_TOKEN="$UI_TOKEN" FUCF_API_LISTEN=127.0.0.1:8787 \
          FUCF_HTTP_LISTEN=127.0.0.1:18080 FUCF_HTTPS_LISTEN=off FUCF_HTTP3_LISTEN=off FUCF_DNS_LISTEN=127.0.0.1:15353 \
          FUCF_EDGE_IPS=127.0.0.1 nohup ./dist/fucf-linux-x86_64 > /tmp/fucf-ui.log 2>&1 &
          for i in $(seq 1 50); do curl -fsS -o /dev/null http://127.0.0.1:8787/ && break; sleep 0.2; done
          tail -5 /tmp/fucf-ui.log
      - name: seed an account, a zone and edge pages
        run: |
          api() { curl -fsS -X "$1" -H "Authorization: Bearer $UI_TOKEN" -H "Content-Type: application/json" "http://127.0.0.1:8787/client/v4$2" ${3:+-d "$3"}; }
          SESSION=$(curl -fsS -X POST -H "Content-Type: application/json" http://127.0.0.1:8787/client/v4/auth/setup \
            -d "{\"token\":\"$UI_TOKEN\",\"email\":\"owner@example.com\",\"password\":\"a long ui check password\"}" | python3 -c 'import sys,json;print(json.load(sys.stdin)["result"]["token"])')
          ZONE=$(api POST /zones '{"name":"example.com"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["result"]["id"])')
          api POST /zones/$ZONE/dns_records '{"type":"A","name":"example.com","content":"127.0.0.1","proxied":true}' >/dev/null
          api POST /zones/$ZONE/dns_records '{"type":"A","name":"down.example.com","content":"192.0.2.1","proxied":true}' >/dev/null
          mkdir -p edge-pages
          # 530: the origin is this edge itself; 404: a host nobody proxies
          curl -s -H "Host: example.com" http://127.0.0.1:18080/ -o edge-pages/530-origin-is-edge.html -w "%{http_code}\n"
          curl -s -H "Host: nowhere.test" http://127.0.0.1:18080/ -o edge-pages/404-unknown-host.html -w "%{http_code}\n"
          # the panel's embedded typefaces: served, typed, cacheable, allowed by the CSP
          for f in inter-latin-wght.woff2 source-serif-4-latin-wght.woff2; do
            curl -fsS -D- -o /dev/null http://127.0.0.1:8787/fonts/$f | grep -qi '^content-type: font/woff2' || { echo "font $f not served"; exit 1; }
          done
          curl -fsS -D- -o /dev/null http://127.0.0.1:8787/ | grep -qi "font-src 'self'" || { echo "CSP blocks the fonts"; exit 1; }
          curl -s -m 20 -H "Host: down.example.com" http://127.0.0.1:18080/ -o edge-pages/52x-origin-down.html -w "%{http_code}\n" || true
          echo "SESSION=$SESSION" >> $GITHUB_ENV; echo "ZONE=$ZONE" >> $GITHUB_ENV
      - name: run the auth worker on fucf
        run: |
          api() { curl -fsS -X "$1" -H "Authorization: Bearer $UI_TOKEN" -H "Content-Type: application/json" "http://127.0.0.1:8787/client/v4$2" ${3:+-d "$3"}; }
          curl -fsS -X PUT -H "Authorization: Bearer $UI_TOKEN" -H "Content-Type: application/javascript" \
            --data-binary @workers/auth/worker.js http://127.0.0.1:8787/client/v4/workers/scripts/auth >/dev/null
          KV=$(api POST /kv/namespaces '{"title":"AUTH_KV"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["result"]["id"])')
          DB=$(api POST /d1/database '{"name":"auth"}' | python3 -c 'import sys,json;r=json.load(sys.stdin)["result"];print(r.get("uuid") or r["id"])')
          api PATCH /workers/scripts/auth/settings "{\"kv_bindings\":{\"AUTH_KV\":\"$KV\"},\"d1_bindings\":{\"AUTH_DB\":\"$DB\"},\"vars\":{\"ISSUER\":\"http://auth.example.com:18080\"}}" >/dev/null
          api POST /zones/$ZONE/dns_records '{"type":"A","name":"auth.example.com","content":"192.0.2.1","proxied":true}' >/dev/null
          api POST /zones/$ZONE/workers/routes '{"pattern":"auth.example.com/*","script":"auth"}' >/dev/null
          sleep 1
          A=http://127.0.0.1:18080
          curl -fsS -H "Host: auth.example.com" $A/healthz; echo
          curl -fsS -H "Host: auth.example.com" $A/.well-known/openid-configuration | python3 -c 'import sys,json;d=json.load(sys.stdin);print("issuer", d["issuer"])'
          curl -fsS -H "Host: auth.example.com" $A/login -o /tmp/auth-login.html
          grep -q 'data-l="en"' /tmp/auth-login.html && grep -q "#d97757" /tmp/auth-login.html || { echo "login page is not the new one"; exit 1; }
          curl -fsS -D /tmp/auth-reg.h -o /dev/null -H "Host: auth.example.com" -H "Origin: http://auth.example.com" -H "Content-Type: application/json" \
            -d '{"email":"ui@example.com","username":"uicheck","name":"UI 检查","password":"a long ui check password"}' $A/register
          AUTH_COOKIE=$(grep -i '^set-cookie: fucf_auth_sid=' /tmp/auth-reg.h | head -1 | sed -E 's/^[Ss]et-[Cc]ookie: ([^;]*).*/\1/' | tr -d '\r')
          [ -n "$AUTH_COOKIE" ] || { echo "no session cookie after registering"; cat /tmp/auth-reg.h; exit 1; }
          curl -fsS -H "Host: auth.example.com" -H "Cookie: $AUTH_COOKIE" $A/account | grep -q "uicheck\|UI 检查" || { echo "account page does not show the user"; exit 1; }
          echo "AUTH_COOKIE=$AUTH_COOKIE" >> $GITHUB_ENV
      - name: a reload (SIGUSR2) keeps the listeners open
        run: |
          PID=$(pgrep -f 'dist/fucf-linux-x86_64' | head -1)
          A=http://127.0.0.1:18080
          # visitors keep coming while the process turns into the binary again
          ( for i in $(seq 1 150); do curl -s -o /dev/null -m 5 -w "%{http_code} %{exitcode}\n" -H "Host: auth.example.com" $A/healthz; sleep 0.02; done ) > /tmp/reload-probe.txt &
          PROBE=$!
          sleep 0.5; kill -USR2 "$PID"; wait $PROBE
          for i in $(seq 1 50); do curl -fsS -o /dev/null http://127.0.0.1:8787/ && break; sleep 0.2; done
          sort /tmp/reload-probe.txt | uniq -c
          [ "$(pgrep -f 'dist/fucf-linux-x86_64' | head -1)" = "$PID" ] || { echo "the process was not replaced in place"; exit 1; }
          grep -q "took over the listener on tcp 127.0.0.1:18080" /tmp/fucf-ui.log || { echo "the edge listener was not handed over"; tail -30 /tmp/fucf-ui.log; exit 1; }
          if grep -qv '^200 0$\|^503 0$' /tmp/reload-probe.txt; then echo "visitors were refused or failed during the reload"; tail -30 /tmp/fucf-ui.log; exit 1; fi
          curl -fsS -H "Host: auth.example.com" $A/healthz; echo
      - name: screenshots
        run: |
          cd scripts/ui && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          node shots.mjs http://127.0.0.1:8787/ "$SESSION" "$ZONE" ../../shots ../../edge-pages/*.html
          node shots-auth.mjs http://auth.example.com:18080 "$AUTH_COOKIE" ../../shots
      - name: the human check catches headless Chromium
        run: |
          api() { curl -fsS -X "$1" -H "Authorization: Bearer $UI_TOKEN" -H "Content-Type: application/json" "http://127.0.0.1:8787/client/v4$2" ${3:+-d "$3"}; }
          api POST /zones/$ZONE/firewall/rules '{"expression":"http.request.uri.path eq \"/guarded-js\"","action":"js_challenge","description":"ci"}' >/dev/null
          api POST /zones/$ZONE/firewall/rules '{"expression":"http.request.uri.path eq \"/guarded-click\"","action":"managed_challenge","description":"ci"}' >/dev/null
          sleep 1
          curl -s -D- -o /dev/null -H "Host: example.com" http://127.0.0.1:18080/guarded-click | grep -i "cf-mitigated: challenge" || { echo "no challenge"; exit 1; }
          cd scripts/ui && node challenge-check.mjs http://example.com:18080 ../../shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: |
            shots/
            edge-pages/
            /tmp/fucf-ui.log
          retention-days: 14

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --verbose --exit-code 1 .
