<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fucloudflare Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f6821f'/%3E%3Cpath d='M9 21h14a3.5 3.5 0 0 0 .5-6.95A5.5 5.5 0 0 0 13 12.5a4 4 0 0 0-3.9 3.1A3 3 0 0 0 9 21z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  --color-kumo-canvas:#fbfbfb;
  --color-kumo-elevated:#f7f7f8;
  --color-kumo-recessed:#f4f4f5;
  --color-kumo-base:#ffffff;
  --color-kumo-tint:#f4f4f5;
  --color-kumo-overlay:#fafafa;
  --color-kumo-control:#ffffff;
  --color-kumo-interact:#e4e4e7;
  --color-kumo-fill:#e4e4e7;
  --color-kumo-fill-hover:#f4f4f5;
  --color-kumo-line:rgba(24,24,27,.1);
  --color-kumo-hairline:#e4e4e7;
  --color-kumo-brand:#056dff;
  --color-kumo-brand-hover:#005aeb;
  --text-color-kumo-default:#18181b;
  --text-color-kumo-inverse:#fafafa;
  --text-color-kumo-strong:#09090b;
  --text-color-kumo-subtle:#52525b;
  --text-color-kumo-placeholder:#a1a1aa;
  --text-color-kumo-brand:#f6821f;
  --text-color-kumo-link:#056dff;
  --text-color-kumo-success:#065f46;
  --text-color-kumo-danger:#b91c1c;
  --text-color-kumo-warning:#b45309;
  --color-kumo-danger:#d91b24;
  --color-kumo-danger-hover:#b91c1c;
  --color-kumo-danger-tint:rgba(217,27,36,.08);
  --color-kumo-success:#10b981;
  --color-kumo-success-tint:rgba(16,185,129,.12);
  --color-kumo-warning:#f59e0b;
  --color-kumo-warning-tint:rgba(245,158,11,.12);
  --color-kumo-info:#056dff;
  --color-kumo-info-tint:rgba(5,109,255,.08);
  --shadow-card:0 1px 2px rgba(0,0,0,.05);
  --shadow-lg:0 20px 50px -12px rgba(0,0,0,.22);
  --scrim:rgba(9,9,11,.45);
  --s1:#10b981;--s2:#056dff;--s3:#f6821f;--s4:#d91b24;
  --sidebar-nav-width:260px;
  --header-height:58px;
  --r-sm:6px;--r-md:8px;--r-lg:12px;--r-xl:16px;--r-pill:999px;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;
}
:root[data-mode="dark"]{
  color-scheme:dark;
  --color-kumo-canvas:#0a0a0b;
  --color-kumo-elevated:#111113;
  --color-kumo-recessed:#141416;
  --color-kumo-base:#18181b;
  --color-kumo-tint:#27272a;
  --color-kumo-overlay:#27272a;
  --color-kumo-control:#1f1f23;
  --color-kumo-interact:#3f3f46;
  --color-kumo-fill:#27272a;
  --color-kumo-fill-hover:#3f3f46;
  --color-kumo-line:rgba(255,255,255,.12);
  --color-kumo-hairline:#27272a;
  --color-kumo-brand:#056dff;
  --color-kumo-brand-hover:#005aeb;
  --text-color-kumo-default:#f4f4f5;
  --text-color-kumo-inverse:#18181b;
  --text-color-kumo-strong:#ffffff;
  --text-color-kumo-subtle:#a1a1aa;
  --text-color-kumo-placeholder:#71717a;
  --text-color-kumo-brand:#f6821f;
  --text-color-kumo-link:#60a5fa;
  --text-color-kumo-success:#6ee7b7;
  --text-color-kumo-danger:#f87171;
  --text-color-kumo-warning:#fbbf24;
  --color-kumo-danger:#d91b24;
  --color-kumo-danger-hover:#ef4444;
  --color-kumo-danger-tint:rgba(217,27,36,.18);
  --color-kumo-success:#34d399;
  --color-kumo-success-tint:rgba(52,211,153,.15);
  --color-kumo-warning:#fbbf24;
  --color-kumo-warning-tint:rgba(251,191,36,.15);
  --color-kumo-info:#60a5fa;
  --color-kumo-info-tint:rgba(59,130,246,.16);
  --shadow-card:0 1px 2px rgba(0,0,0,.35);
  --shadow-lg:0 24px 60px -12px rgba(0,0,0,.7);
  --scrim:rgba(0,0,0,.65);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scrollbar-color:var(--color-kumo-interact) transparent;overflow-x:hidden}
body{margin:0;min-height:100dvh;font:14px/1.5 var(--sans);background:var(--color-kumo-canvas);color:var(--text-color-kumo-default);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--text-color-kumo-link);text-decoration:none;cursor:pointer;font-weight:500}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--color-kumo-brand);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
.mono,code{font-family:var(--mono);font-size:12.5px}
code{display:inline-block;max-width:100%;vertical-align:middle;background:var(--color-kumo-recessed);border:1px solid var(--color-kumo-hairline);padding:1px 6px;border-radius:var(--r-sm);overflow-wrap:anywhere;color:var(--text-color-kumo-strong)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.hint{color:var(--text-color-kumo-subtle);font-size:12.5px;font-weight:400}
.pad{padding:0 20px 16px}
.kv.pad{padding:14px 20px}

/* progress bar */
.bar{position:fixed;inset:0 0 auto 0;height:2px;z-index:100;overflow:hidden;opacity:0;transition:opacity .15s;pointer-events:none}
.bar::after{content:"";display:block;height:100%;width:35%;background:var(--text-color-kumo-brand);animation:slide 1s ease-in-out infinite}
body.busy .bar{opacity:1}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}

/* Kumo App-Dash Shell: 260px/57px sidebar + 58px topbar + 1000px track */
.sb-backdrop{display:none}
.shell{display:grid;grid-template-columns:var(--sidebar-nav-width) minmax(0,1fr);min-height:100dvh;transition:grid-template-columns .18s ease}
.shell[data-collapsed="true"]{--sidebar-nav-width:57px}
[data-sidebar="sidebar"]{position:sticky;top:0;height:100dvh;width:var(--sidebar-nav-width);display:flex;flex-direction:column;background:var(--color-kumo-elevated);border-right:1px solid var(--color-kumo-hairline);overflow:hidden;transition:width .18s ease;z-index:20}
.sb-head{height:var(--header-height);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;border-bottom:1px solid var(--color-kumo-hairline);flex:none}
.brand{display:flex;align-items:center;gap:10px;color:var(--text-color-kumo-strong);font-weight:700;font-size:15px;letter-spacing:-.02em;min-width:0;text-decoration:none}
.brand:hover{text-decoration:none;color:var(--text-color-kumo-strong)}
.mark{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:var(--r-md);background:var(--text-color-kumo-brand);color:#fff}
.sb-toggle{flex:none;display:grid;place-items:center;width:28px;height:28px;padding:0;border:0;border-radius:var(--r-sm);background:transparent;color:var(--text-color-kumo-subtle);cursor:pointer}
.sb-toggle:hover{background:var(--color-kumo-tint);color:var(--text-color-kumo-strong)}
[data-sidebar="sidebar"] nav{flex:1;min-height:0;padding:10px 8px;overflow-y:auto;scrollbar-width:thin}
.sb-lbl{padding:8px 10px 4px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-color-kumo-subtle);white-space:nowrap}
.sb-back{display:flex;align-items:center;gap:10px;padding:7px 10px;margin-bottom:6px;border-radius:var(--r-md);color:var(--text-color-kumo-subtle);font-size:13px;font-weight:500;text-decoration:none}
.sb-back:hover{background:var(--color-kumo-tint);color:var(--text-color-kumo-strong);text-decoration:none}
.sb-zn{margin:4px 2px 10px;padding:10px 12px;background:var(--color-kumo-base);border:1px solid var(--color-kumo-hairline);border-radius:var(--r-md)}
.sb-zn b{display:block;font-size:13.5px;font-weight:600;color:var(--text-color-kumo-strong);word-break:break-all}
.sb-zn span{font-size:12px;color:var(--text-color-kumo-subtle)}
.nv{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:2px 0;border-radius:var(--r-md);color:var(--text-color-kumo-subtle);font-size:13.5px;font-weight:500;white-space:nowrap;text-decoration:none;transition:background .12s,color .12s}
.nv svg{flex:none}
.nv:hover{background:var(--color-kumo-tint);color:var(--text-color-kumo-strong);text-decoration:none}
.nv.on,.nv.on:hover{background:var(--color-kumo-tint);color:var(--text-color-kumo-strong);font-weight:600;box-shadow:inset 3px 0 0 var(--text-color-kumo-brand)}
[data-sidebar="sidebar"] hr{border:0;border-top:1px solid var(--color-kumo-hairline);margin:8px 10px}
.sf{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-top:1px solid var(--color-kumo-hairline);background:var(--color-kumo-recessed);font-size:12px;color:var(--text-color-kumo-subtle)}
.sf b{display:block;color:var(--text-color-kumo-strong);font-size:12.5px}
.shell[data-collapsed="true"] .brand-txt,
.shell[data-collapsed="true"] .sb-lbl,
.shell[data-collapsed="true"] .nv-lbl,
.shell[data-collapsed="true"] .sb-zn,
.shell[data-collapsed="true"] .sf-meta,
.shell[data-collapsed="true"] .sf .tag{display:none}
.shell[data-collapsed="true"] .sb-head{justify-content:center;padding:0 6px}
.shell[data-collapsed="true"] .brand{display:none}
.shell[data-collapsed="true"] .nv,.shell[data-collapsed="true"] .sb-back{justify-content:center;padding:8px}
.shell[data-collapsed="true"] .sf{justify-content:center;padding:10px 6px}

.col{min-width:0;max-width:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:15;height:var(--header-height);min-height:var(--header-height);display:flex;align-items:center;gap:10px;padding:0 20px;background:var(--color-kumo-base);border-bottom:1px solid var(--color-kumo-hairline)}
.mob-menu{display:none;place-items:center;width:32px;height:32px;padding:0;border:1px solid var(--color-kumo-line);border-radius:var(--r-md);background:var(--color-kumo-control);color:var(--text-color-kumo-default);cursor:pointer}
.zsel{display:flex;align-items:center;gap:6px;min-width:0;color:var(--text-color-kumo-subtle)}
.zsel select{width:auto;max-width:260px;height:32px;padding:0 10px;border:1px solid var(--color-kumo-line);border-radius:var(--r-md);background:var(--color-kumo-control);color:var(--text-color-kumo-strong);font-size:13px;font-weight:500}
.top .sp{flex:1}
.top .meta{display:flex;align-items:center;gap:6px;white-space:nowrap}
.who{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--r-md);color:var(--text-color-kumo-default);font-size:13px;font-weight:500}
.who:hover{background:var(--color-kumo-tint);text-decoration:none}

/* Centered 1000px track */
main{flex:1;min-width:0;max-width:100%}
.wrap{max-width:1000px;width:100%;margin:0 auto;padding:28px 20px 72px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.ph h1{font-size:24px;font-weight:700;letter-spacing:-.025em;line-height:1.25;color:var(--text-color-kumo-strong);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph p{color:var(--text-color-kumo-subtle);margin-top:6px;max-width:72ch;font-size:13.5px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Kumo LayerCard & surfaces */
.card,[data-kumo-component="Card"]{background:var(--color-kumo-base);border:1px solid var(--color-kumo-hairline);border-radius:var(--r-xl);box-shadow:var(--shadow-card);margin-bottom:18px;overflow:hidden}
.ch{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--color-kumo-hairline);flex-wrap:wrap}
.ch h3{font-size:15px;font-weight:600;color:var(--text-color-kumo-strong);margin-right:auto;display:flex;align-items:center;gap:8px}
.ch input[type="search"]{width:220px;height:32px;font-size:13px}
.ch a{font-size:13px}
.cb{padding:18px 20px}
.cnt{font-size:11.5px;font-weight:600;color:var(--text-color-kumo-subtle);background:var(--color-kumo-tint);border:1px solid var(--color-kumo-hairline);border-radius:var(--r-pill);padding:1px 8px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:18px}
.grid2 .card{margin-bottom:0}
.note{background:var(--color-kumo-info-tint);border:1px solid color-mix(in srgb,var(--color-kumo-info) 28%,transparent);border-radius:var(--r-lg);padding:12px 16px;margin-bottom:18px;font-size:13.5px;line-height:1.65;color:var(--text-color-kumo-default)}
.note.warn{background:var(--color-kumo-warning-tint);border-color:color-mix(in srgb,var(--color-kumo-warning) 35%,transparent)}
.note.bad{background:var(--color-kumo-danger-tint);border-color:color-mix(in srgb,var(--color-kumo-danger) 35%,transparent)}
.note .hint{display:block;margin-top:4px}

/* Hero status banner (compact Kumo style) */
.hero{position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 24px;margin-bottom:18px;background:var(--color-kumo-base);border:1px solid var(--color-kumo-hairline);border-left:4px solid var(--text-color-kumo-brand);border-radius:var(--r-xl);box-shadow:var(--shadow-card);flex-wrap:wrap}
.hero.bad{border-left-color:var(--color-kumo-danger)}
.eyebrow{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--text-color-kumo-brand) 14%,transparent);color:var(--text-color-kumo-brand);font-size:11.5px;font-weight:600}
.eyebrow.bad{background:var(--color-kumo-danger-tint);color:var(--text-color-kumo-danger)}
.hero h2{font-size:20px;font-weight:700;letter-spacing:-.02em;color:var(--text-color-kumo-strong);margin:8px 0 4px}
.hero p{font-size:13.5px;color:var(--text-color-kumo-subtle)}
.hns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.hn{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:var(--r-pill);background:var(--color-kumo-recessed);border:1px solid var(--color-kumo-hairline);color:var(--text-color-kumo-default);font-weight:500;font-size:12.5px;text-decoration:none}
.hn:hover{background:var(--color-kumo-tint);text-decoration:none}
.hn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--text-color-kumo-placeholder)}
.hn.ok::before{background:var(--color-kumo-success)}
.hn.bad::before{background:var(--color-kumo-danger)}

/* KPI tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.tile{display:flex;flex-direction:column;gap:4px;padding:16px 18px;background:var(--color-kumo-base);border:1px solid var(--color-kumo-hairline);border-radius:var(--r-xl);box-shadow:var(--shadow-card);color:inherit;text-decoration:none}
a.tile:hover{border-color:var(--color-kumo-brand);text-decoration:none}
.tile-hd{display:flex;align-items:center;justify-content:space-between;color:var(--text-color-kumo-subtle);font-size:12.5px;font-weight:500}
.tile .ti{color:var(--text-color-kumo-brand)}
.tile b{font-size:22px;font-weight:700;color:var(--text-color-kumo-strong);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile em{font-style:normal;font-size:12px;color:var(--text-color-kumo-subtle)}

/* Settings rows */
.set{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 24px;align-items:center;padding:16px 20px;border-top:1px solid var(--color-kumo-hairline)}
.set:first-child{border-top:0}
.set h4{font-size:14px;font-weight:600;color:var(--text-color-kumo-strong);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.set p{color:var(--text-color-kumo-subtle);font-size:13px;margin-top:2px;max-width:64ch}
.set .ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.set .ctl select{min-width:220px}
.set.stack{grid-template-columns:1fr}
.set.stack .ctl{justify-content:flex-start}
.card.danger{border-color:color-mix(in srgb,var(--color-kumo-danger) 45%,var(--color-kumo-hairline))}

/* Switches & Checkboxes */
.sw{position:relative;display:inline-flex;flex:none;cursor:pointer}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw i{width:42px;height:24px;border-radius:var(--r-pill);background:var(--color-kumo-interact);transition:background .15s;position:relative;display:block}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .16s ease}
.sw input:checked+i{background:var(--color-kumo-brand)}
.sw input:checked+i::after{transform:translateX(18px)}
.chks{display:flex;flex-wrap:wrap;gap:8px}
.chks label{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--color-kumo-line);border-radius:var(--r-md);cursor:pointer;font-size:13px;font-weight:500;background:var(--color-kumo-control)}
.chks label:hover{background:var(--color-kumo-tint)}
.chks label:has(input:checked){border-color:var(--color-kumo-brand);background:var(--color-kumo-info-tint)}
.chks input{width:auto;margin:0;accent-color:var(--color-kumo-brand)}

/* Tables */
.tw{position:relative;overflow-x:auto;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:11px 14px;vertical-align:middle;border-bottom:1px solid var(--color-kumo-hairline)}
th:first-child,td:first-child{padding-left:20px}
th:last-child,td:last-child{padding-right:20px}
th{font-size:12px;font-weight:600;color:var(--text-color-kumo-subtle);background:var(--color-kumo-elevated);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--color-kumo-tint)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.act,th.act{text-align:right;white-space:nowrap}
.sub{display:block;font-size:12px;color:var(--text-color-kumo-subtle);margin-top:2px}
.expr{font-size:12px;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:36px 20px;text-align:center;color:var(--text-color-kumo-subtle);font-size:13.5px}
.empty b{display:block;color:var(--text-color-kumo-strong);font-size:14.5px;margin-bottom:4px}

/* Badges & Tags */
.st,.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:var(--r-pill);font-size:12px;font-weight:500;background:var(--color-kumo-tint);color:var(--text-color-kumo-subtle);white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.ok,.tag.ok{background:var(--color-kumo-success-tint);color:var(--text-color-kumo-success)}
.st.bad,.tag.bad{background:var(--color-kumo-danger-tint);color:var(--text-color-kumo-danger)}
.st.warn,.tag.warn{background:var(--color-kumo-warning-tint);color:var(--text-color-kumo-warning)}
.st.px,.tag.pri{background:color-mix(in srgb,var(--text-color-kumo-brand) 14%,transparent);color:var(--text-color-kumo-brand)}
.tag.blue{background:var(--color-kumo-info-tint);color:var(--text-color-kumo-link)}
.chips{display:inline-flex;flex-wrap:wrap;gap:4px}

/* Buttons */
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--r-md);border:1px solid var(--color-kumo-line);background:var(--color-kumo-control);color:var(--text-color-kumo-default);font:500 13.5px/1 var(--sans);cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .12s,border-color .12s}
button:hover,.btn:hover{background:var(--color-kumo-fill-hover);text-decoration:none}
button:disabled{opacity:.55;cursor:not-allowed}
button.pri,.btn.pri{background:var(--color-kumo-brand);border-color:var(--color-kumo-brand);color:#fff}
button.pri:hover,.btn.pri:hover{background:var(--color-kumo-brand-hover);border-color:var(--color-kumo-brand-hover)}

function fieldHtml(f, v) {
  const name = `name="${esc(f.k)}"`, hint = f.hint ? `<small>${esc(f.hint)}</small>` : "";
  const pair = o => (Array.isArray(o) ? o : [o, o]);
  let input;
  if (f.type === "head") return `<div class="f"><span class="fl">${esc(f.label)}</span>${hint}</div>`;
  if (f.type === "html") return `<div class="f">${f.html}</div>`;
  if (f.type === "check") return `<div class="f"><label class="chk"><span class="sw"><input type="checkbox" ${name} ${v ? "checked" : ""}><i></i></span><span>${esc(f.label)}</span></label>${hint}</div>`;
  if (f.type === "multi") return `<div class="f"><span class="fl">${esc(f.label)}</span><div class="chks">${f.options.map(o => { const [val, text] = pair(o); return `<label><input type="checkbox" ${name} value="${esc(val)}" ${(v || []).includes(val) ? "checked" : ""}>${esc(text)}</label>`; }).join("") || '<span class="hint">（无可选项）</span>'}</div>${hint}</div>`;
  if (f.type === "select") input = `<select ${name}>${f.options.map(o => { const [val, text] = pair(o); return `<option value="${esc(val)}" ${String(v ?? "") === String(val) ? "selected" : ""}>${esc(text || "（默认）")}</option>`; }).join("")}</select>`;
  else if (f.type === "textarea") input = `<textarea ${name} class="${f.tall ? "tall" : ""}" spellcheck="false">${esc(v)}</textarea>`;
  else if (f.type === "json") input = `<textarea ${name} spellcheck="false">${esc(JSON.stringify(v ?? (f.defJson ?? {}), null, 2))}</textarea>`;
  else if (f.type === "list" || f.type === "numlist") input = `<input ${name} value="${esc((v || []).join(", "))}" autocomplete="off">`;
  else input = `<input ${name} type="${f.type === "number" ? "number" : f.type === "password" ? "password" : "text"}"${f.step ? ` step="${esc(f.step)}"` : ""}${f.min !== undefined ? ` min="${esc(f.min)}"` : ""}${f.max !== undefined ? ` max="${esc(f.max)}"` : ""} value="${esc(v)}" ${f.readonly ? "readonly" : ""} autocomplete="${f.type === "password" ? (f.auto || "current-password") : "off"}">`;
  return `<label class="f"><span>${esc(f.label)}</span>${input}${hint}</label>`;
}
function collect(fields, form) {
  const o = {};
  for (const f of fields) {
    if (f.type === "head" || f.type === "html") continue;
    const el = form.querySelector(`[name="${f.k}"]`);
    if (f.type === "check") o[f.k] = el.checked;
    else if (f.type === "multi") o[f.k] = [...form.querySelectorAll(`[name="${f.k}"]:checked`)].map(e => e.value);
    else if (f.type === "number") o[f.k] = el.value === "" ? (f.opt ? null : f.def ?? 0) : Number(el.value);
    else if (f.type === "list") o[f.k] = el.value.split(/[,\s]+/).filter(Boolean);
    else if (f.type === "numlist") o[f.k] = el.value.split(/[,\s]+/).filter(Boolean).map(Number);
    else if (f.type === "json") { try { o[f.k] = JSON.parse(el.value || "{}"); } catch { throw new Error(`“${f.label}”不是合法的 JSON`); } }
    else o[f.k] = el.value === "" && f.opt ? null : el.value;
  }
  return o;
}
function openForm(title, fields, values, onSave, wide) {
  const m = document.getElementById("modal");
  m.innerHTML = `<div class="ov"><aside class="drawer${wide ? " wide" : ""}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><form novalidate>
    <header><h2>${esc(title)}</h2><button type="button" class="icon" data-close aria-label="关闭">${IC.close}</button></header>
    <div class="dbody">${fields.map(f => fieldHtml(f, values[f.k] ?? f.def)).join("")}</div>
    <footer><p class="ferr" role="alert"></p><button type="button" data-close>取消</button><button class="pri">保存</button></footer></form></aside></div>`;
  const close = () => { m.innerHTML = ""; document.removeEventListener("keydown", key); };
  const key = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", key);
  const ov = m.querySelector(".ov"), form = m.querySelector("form"), err = m.querySelector(".ferr"), save = form.querySelector("button.pri");
  let downOnScrim = false;
  ov.onmousedown = e => { downOnScrim = e.target === ov; };
  ov.onclick = e => { if ((e.target === ov && downOnScrim) || e.target.closest("[data-close]")) close(); };
  form.onsubmit = async e => {
    e.preventDefault();
    err.textContent = "";

}

  const versions = [...new Set(nodes.filter(n => n.exe).map(n => n.exe))];

  const tot = { requests: 0, bytes: 0, cached: 0, threats: 0, s2: 0, s3: 0, s4: 0, s5: 0, h1: 0, h2: 0, h3: 0 };

  }).sort((a, b) => (b.a.requests || 0) - (a.a.requests || 0));

    const g = s.gfw;

      gfwProbed++;

    }
  }

  const allGood = on.length > 0 && healthy === on.length && versions.length <= 1;

    <p>${zones.length} 个域名 · ${online}/${on.length} 在线 · ${versions.length <= 1 ? "全集群版本一致" : `存在 ${versions.length} 个版本`} · ${steer.filter(r => r.enabled).length} 条调度规则</p>
    <div class="hns">${nodes.map(n => `<a class="hn ${n.config && !n.config.enabled ? "" : n.online && n.healthy ? "ok" : "bad"}" href="#/fleet" title="${esc(n.name)}">${esc(n.name)}</a>`).join("")}</div></div></section>`;

  const tiles = `<div class="tiles">${
    tile("24h 访问量", num(tot.requests), `${zones.length} 个域名合计请求`, "", "chart")}${
    tile("24h 出站流量", bytes(tot.bytes), `本月全节点累计 ${bytes(monthBytes)}`, "", "data")}${
    tile("全站缓存命中率", hitRate, `${num(tot.cached)} 次命中 · 缓存 ${bytes(cacheBytes)}`, "", "bolt")}${
    tile("24h 安全拦截", num(tot.threats), "防火墙、限速与托管 WAF", "", "shield")}</div>
    <div class="tiles">${
    tile("节点健康", `${healthy} / ${on.length}`, versions.length <= 1 ? "版本统一 · 同步正常" : `机群有 ${versions.length} 个版本`, "#/fleet", "server")}${
    tile("大陆 TCP 连通", gfwProbed ? `v4 ${gfwV4Tcp}/${gfwProbed} · v6 ${gfwV6Tcp}/${gfwProbed}` : "待探测", gfwProbed ? `UDP: v4 ${gfwV4Udp}/${gfwProbed} · v6 ${gfwV6Udp}/${gfwProbed}` : "每小时自动监测", "#/fleet", "globe")}${
    tile("本月 CDN 用量", bytes(monthBytes), `${nodes.filter(n => n.config && n.config.traffic_limit_gb).length} 台节点配置了配额`, "#/fleet", "data")}${
    tile("边缘缓存池", `${num(cacheObjs)} 对象`, cacheMax ? `${bytes(cacheBytes)} / ${bytes(cacheMax)}` : bytes(cacheBytes), "#/fleet", "bolt")}</div>`;

  const bars = `<div class="grid2">${
    card("24h 状态码分布", "", `<div class="cb">${segBar([{ label: "2xx 成功", value: tot.s2, c: "--s1" }, { label: "3xx 跳转", value: tot.s3, c: "--s2" }, { label: "4xx 客户端错误", value: tot.s4, c: "--s3" }, { label: "5xx 服务端错误", value: tot.s5, c: "--s4" }], "状态码分布")}</div>`)}${
    card("24h 协议分布", "", `<div class="cb">${segBar([{ label: "HTTP/1.1", value: tot.h1, c: "--s1" }, { label: "HTTP/2", value: tot.h2, c: "--s2" }, { label: "HTTP/3", value: tot.h3, c: "--s3" }], "协议分布")}</div>`)}</div>`;

  const gfwCell = n => {
    const g = (n.status || {}).gfw;
    if (!g || (g.v4_tcp == null && g.v4_udp == null && g.v6_tcp == null && g.v6_udp == null)) return '<span class="hint">待探测</span>';
    const p = (l, v) => v == null ? "" : `<span class="tag ${v ? "ok" : "bad"}">${l}${v ? "✓" : "✗"}</span>`;
    return [p("v4T ", g.v4_tcp), p("v4U ", g.v4_udp), p("v6T ", g.v6_tcp), p("v6U ", g.v6_udp)].filter(Boolean).join(" ");

  const limitCell = n => {

  const nodeTable = card(`节点运行状况与大陆被墙检测 <span class="cnt">${nodes.length}</span>`, '<a href="#/fleet">节点管理</a>', table([
    { label: "节点", fmt: n => `<a href="#/fleet"><b>${esc(n.name)}</b></a>${n.role === "accelerate" ? ' <span class="tag warn">加速</span>' : ' <span class="tag blue">Peer</span>'}${n.self ? ' <span class="tag pri">本机</span>' : ""}` },

    { label: "边缘缓存", fmt: n => { const ca = (n.status || {}).cache; return ca ? `${num(ca.objects)} · ${bytes(ca.bytes)}` : "—"; } },
    { label: "内存 / 负载", fmt: n => { const s = n.status || {}; const mem = s.memory_bytes ? bytes(s.memory_bytes) : "—"; const ld = s.load && s.load.length ? s.load[0].toFixed(2) : "—"; return `<span class="mono">${mem} · ${ld}</span>`; } },
    { label: "运行", fmt: n => { const s = n.status || {}; return s.uptime_seconds !== undefined ? dur(s.uptime_seconds) : "—"; }, cls: "num" },
  ], nodes, null, "<b>还没有节点</b>"));

  const zoneTable = card(`域名 24h 访问与缓存排行 <span class="cnt">${zones.length}</span>`, '<a href="#/zones">全部域名</a>', table([
    { label: "域名", fmt: ({ z }) => `<a href="#/zone/${esc(z.id)}/overview"><b>${esc(z.name)}</b></a>` },
    { label: "状态", fmt: ({ z }) => stateTag(z) },
    { label: "24h 请求", fmt: ({ a }) => num(a.requests || 0), cls: "num" },
    { label: "24h 流量", fmt: ({ a }) => bytes(a.bytes || 0), cls: "num" },
    { label: "缓存命中率", fmt: ({ a }) => (a.requests ? `${(a.cached / a.requests * 100).toFixed(1)}%` : "—"), cls: "num" },
    { label: "拦截", fmt: ({ a }) => num(a.threats || 0), cls: "num" },
  ], zRows, ({ z }) => `<a href="#/zone/${esc(z.id)}/analytics">详情</a>`, "<b>还没有域名</b>"));

  return { title: "总览面板", sub: "全集群运行状况、24 小时访问量、流量配额、缓存命中率与大陆被墙监测一览。", acts: btn("retry", "刷新数据", {}, ""), body: hero + tiles + bars + nodeTable + zoneTable };
}

    tile("健康节点", `${up} / ${on.length}`, nodes.length - on.length ? `另有 ${nodes.length - on.length} 个已停用` : "启用的节点", "#/fleet", "server")}${
    tile("调度规则", steer.filter(r => r.action !== "block").length, "按国家、大洲、运营商", "#/steering", "route")}${
    tile("DNS 屏蔽规则", blocks, blocks ? "命中的访客被拒绝解析" : "未屏蔽任何地区", "#/steering", "ban")}</div>`;
  const list = card(`域名 <span class="cnt">${zones.length}</span>`, zones.length > 6 ? `<input type="search" placeholder="搜索域名" data-filter="zones" value="${esc(F.zones || "")}" aria-label="搜索域名">` : "", table([
    { label: "域名", fmt: z => `<a href="#/zone/${esc(z.id)}/overview"><b>${esc(z.name)}</b></a>` },
    { label: "接入方式", fmt: modeTag }, { label: "状态", fmt: stateTag }, { label: "HTTP 协议", fmt: z => protoChips(z.settings) },
  ], zones, z => `<a href="#/zone/${esc(z.id)}/overview">管理</a>`,
    `<b>还没有域名</b>添加一个域名，选择完全托管（NS）或 CNAME 接入。<br><br>${btn("zoneAdd", "添加域名", {}, "pri")}`, "zones"));
  return { title: "账户主页", sub: "这个边缘平台上托管的域名，以及节点和调度的概况。", acts: btn("zoneAdd", "添加域名", {}, "pri"), body: tiles + list };
}

  if (!d.success) throw Object.assign(new Error(AUTH_TEXT[d.errors[0].code] || d.errors[0].message), { code: d.errors[0].code, detail: d.errors[0].message });
  return d.result;

function applyFilters() {
  for (const id in F) {
    const q = (F[id] || "").trim().toLowerCase();

async function render() {
  const qs = new URLSearchParams(location.search);
  const hs = new URLSearchParams(location.hash.replace(/^#/, ""));
  const oauthTok = qs.get("oauth_token") || hs.get("oauth_token");
  const oauthErr = qs.get("oauth_error") || hs.get("oauth_error");
  if (oauthTok) {
    token = oauthTok;
    localStorage.setItem("fucf_token", token);
    history.replaceState(null, "", location.pathname + "#/overview");
  } else if (oauthErr) {
    loginError = "OAuth 登录失败：" + oauthErr;
    history.replaceState(null, "", location.pathname + (location.hash || ""));
  }
  const app = document.getElementById("app");
  if (!token) return renderAuth(app);
  const my = ++seq;
  S = parseHash();
  busy(true);
  try {
    me = await api("GET", "/account");
    if (my !== seq) return;
    if (me.must_change_password) { app.innerHTML = mustChange(); return; }
    [sys, C.zones] = await Promise.all([api("GET", "/system"), api("GET", "/zones?per_page=1000")]);
    if (my !== seq) return;
    if (NAV.some(n => n[0] === S.view && n[3] && n[3] !== me.role)) S = { view: "zones" };
    const v = await VIEWS[S.view]();
    if (my !== seq) return;
    app.innerHTML = shell(v);
    applyFilters();
  } catch (e) {
    if (my !== seq || !token) return;
    app.innerHTML = shell({ title: "加载失败", body: `<div class="note bad">${esc(e.message)}　<a data-act="retry">重试</a> · <a href="#/zones">返回账户主页</a></div>` });
  } finally { if (my === seq) busy(false); }
}

document.addEventListener("click", e => {
  const copy = e.target.closest("[data-copy]");
  if (copy) { navigator.clipboard.writeText(copy.dataset.copy).then(() => toast("已复制"), () => toast("复制失败", true)); return; }
  const el = e.target.closest("[data-act]");
  if (!el) return;
  e.preventDefault();
  run(async () => {
    if (el.dataset.act === "steerEdit") C.nodeNames = (await api("GET", "/nodes")).map(n => n.name);
    await A[el.dataset.act](el.dataset);
  });
});

  run(async () => {
    try { await api("PATCH", `/zones/${S.zone}/settings/${key}`, { value }); toast("已保存"); }
    finally { render(); }
  });
});
document.addEventListener("input", e => {
  if (e.target.id === "kvPrefixInput") { F.kvPrefix = e.target.value; return; }
  if (e.target.id === "d1SqlBox") { WUI.d1Sql = e.target.value; return; }
  const id = e.target.dataset && e.target.dataset.filter;
  if (!id) return;
  F[id] = e.target.value;
  applyFilters();
});
document.addEventListener("keydown", e => {
  if (e.target.id === "kvPrefixInput" && e.key === "Enter") { e.preventDefault(); render(); }
});

// Drag-and-drop for fleet continent assignment & steering priority
let dragCtx = null;
document.addEventListener("dragstart", e => {
  const el = e.target.closest("[data-drag-kind]");
  if (!el) return;
  dragCtx = { kind: el.dataset.dragKind, nodeId: el.dataset.nodeId, nodeName: el.dataset.nodeName, ruleId: el.dataset.ruleId, idx: Number(el.dataset.idx) };
  el.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  try { e.dataTransfer.setData("text/plain", el.dataset.nodeId || el.dataset.nodeName || String(el.dataset.idx)); } catch {}
});
document.addEventListener("dragend", () => {
  document.querySelectorAll(".dragging,.over").forEach(x => x.classList.remove("dragging", "over"));
  dragCtx = null;
});
document.addEventListener("dragover", e => {
  if (!dragCtx) return;
  const target = e.target.closest("[data-drop-kind]");
  if (!target) return;
  const dk = target.dataset.dropKind;
  const ok = (dragCtx.kind === "fleet-node" && dk === "fleet-cont")
    || (dragCtx.kind === "steer-add" && (dk === "steer-rule" || dk === "steer-node"))
    || (dragCtx.kind === "steer-node" && (dk === "steer-node" || dk === "steer-rule") && target.dataset.ruleId === dragCtx.ruleId);
  if (!ok) return;
  e.preventDefault();
  target.classList.add("over");
});
document.addEventListener("dragleave", e => {
  const target = e.target.closest("[data-drop-kind]");
  if (target) target.classList.remove("over");
});
document.addEventListener("drop", e => {
  if (!dragCtx) return;
  const target = e.target.closest("[data-drop-kind]");
  if (!target) return;
  const ctx = dragCtx;
  dragCtx = null;
  target.classList.remove("over");
  const dk = target.dataset.dropKind;
  if (ctx.kind === "fleet-node" && dk === "fleet-cont") {
    e.preventDefault();
    const cont = target.dataset.cont, n = byId("nodes", ctx.nodeId);
    if (!n.id || (n.continents || []).includes(cont)) return;
    run(async () => {
      await api("PUT", "/nodes/" + n.id, { ...n, continents: [...(n.continents || []), cont] });
      toast(`已将 ${n.name} 分配到 ${CONT[cont] || cont}`); render();
    });
  } else if (ctx.kind === "steer-add" && (dk === "steer-rule" || dk === "steer-node")) {
    e.preventDefault();
    const r = byId("steer", target.dataset.ruleId);
    if (!r.id || (r.nodes || []).includes(ctx.nodeName)) return;
    run(async () => {
      await api("PUT", "/steering/" + r.id, { ...r, nodes: [...(r.nodes || []), ctx.nodeName] });
      toast(`已将 ${ctx.nodeName} 加入规则“${r.name}”`); render();
    });
  } else if (ctx.kind === "steer-node" && dk === "steer-node" && target.dataset.ruleId === ctx.ruleId) {
    e.preventDefault();
    const r = byId("steer", ctx.ruleId), from = ctx.idx, to = Number(target.dataset.idx);
    if (!r.id || from === to) return;
    const nodes = [...(r.nodes || [])];
    const [moved] = nodes.splice(from, 1);
    nodes.splice(to, 0, moved);
    run(async () => {
      await api("PUT", "/steering/" + r.id, { ...r, nodes });
      toast("已调整节点优先级顺序"); render();
    });
  }
});
window.addEventListener("hashchange", () => { window.scrollTo(0, 0); render(); });
render();
</script>
</body>
</html>
