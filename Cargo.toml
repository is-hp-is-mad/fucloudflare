[package]
name = "fucloudflare"
version = "0.1.0"
edition = "2021"
description = "A self-hosted Cloudflare-like edge platform: authoritative DNS, CDN, WAF"
license = "MIT"
readme = "README.md"
repository = "https://github.com/is-hp-is-mad/fucloudflare"

[[bin]]
name = "fucf"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
hyper = { version = "1.12.0", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "server-auto", "tokio", "http1", "http2"] }
http-body-util = "0.1.5"
bytes = "1.12.2"
regex = "1.13.2"
percent-encoding = "2.3.2"
tower-service = "0.3.3"
webpki-roots = "1.0.12"
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
boa_engine = "0.22.0"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
flate2 = "1.1.11"
brotli = "9.1.3"
http-body = "1.1.0"
maxminddb = { version = "0.33.0", features = ["mmap"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rusqlite = { version = "0.32", features = ["bundled", "backup", "hooks"] }
base64 = "0.22"
libc = "0.2"
memmap2 = "0.9"

[profile.release]
lto = "thin"
